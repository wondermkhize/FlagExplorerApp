name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Lint frontend
        working-directory: ./client
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./client
        run: npm test -- --run

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore solution dependencies
        run: dotnet restore ./FlagExplorerApp.sln

      - name: Build solution
        run: dotnet build ./FlagExplorerApp.sln --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test ./BackEndTests/BackEndTests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish backend
        run: dotnet publish ./API/API.csproj -c Release -o ./backend-publish --no-build

      - name: Package artifacts
        run: |
          zip -r frontend-build.zip ./client/dist
          zip -r backend-build.zip ./backend-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            frontend-build.zip
            backend-build.zip
          if-no-files-found: error
